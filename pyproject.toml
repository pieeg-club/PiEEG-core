[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pieeg-core"
version = "0.5.0"
description = "Native accelerator for PiEEG — drop in, go faster"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "PiEEG Community"},
]
keywords = ["eeg", "bci", "pieeg", "dsp", "native", "accelerator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/pieeg-club/PiEEG-core"
Repository = "https://github.com/pieeg-club/PiEEG-core"
Issues = "https://github.com/pieeg-club/PiEEG-core/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "pieeg_core"
