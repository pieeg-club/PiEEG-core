[package]
name = "pieeg-core"
version = "0.3.0"
edition = "2021"
description = "Native accelerator for PiEEG — compiled signal processing, zero-copy acquisition"
license = "AGPL-3.0-or-later"

[lib]
name = "pieeg_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
crossbeam-queue = "0.3"

# Hardware I/O (Linux-only). Pulled in only when the `hardware` feature is
# enabled — e.g. the aarch64 Raspberry Pi wheel build. Off-Pi dev builds leave
# the feature off, so these never compile on Windows/macOS.
spidev = { version = "0.6", optional = true }
gpio-cdev = { version = "0.6", optional = true }
# Raw syscalls for the real-time read thread: SCHED_FIFO, CPU affinity,
# mlockall and poll() on the DRDY edge-event fd. Linux-only, hardware-gated.
libc = { version = "0.2", optional = true }

[features]
# Native SPI/GPIO acquisition loop. Enable when building for the Raspberry Pi.
hardware = ["dep:spidev", "dep:gpio-cdev", "dep:libc"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
